<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="llama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="beret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid decoration -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Llama legs -->
  <rect x="168" y="370" width="34" height="95" rx="14" fill="url(#llama)"/>
  <rect x="214" y="370" width="34" height="88" rx="14" fill="url(#llama)"/>
  <rect x="264" y="370" width="34" height="88" rx="14" fill="url(#llama)"/>
  <rect x="310" y="370" width="34" height="95" rx="14" fill="url(#llama)"/>

  <!-- Body -->
  <ellipse cx="256" cy="330" rx="130" ry="88" fill="url(#llama)"/>

  <!-- Neck -->
  <path d="M220 280 Q218 240 230 210 Q242 195 256 192 Q270 195 282 210 Q294 240 292 280 Z"
        fill="url(#llama)"/>

  <!-- Head -->
  <ellipse cx="256" cy="185" rx="68" ry="62" fill="url(#llama)"/>

  <!-- Left ear -->
  <ellipse cx="212" cy="140" rx="18" ry="28" fill="url(#llama)" transform="rotate(-12 212 140)"/>
  <ellipse cx="212" cy="140" rx="10" ry="18" fill="#f8c0c0" transform="rotate(-12 212 140)"/>

  <!-- Right ear -->
  <ellipse cx="300" cy="140" rx="18" ry="28" fill="url(#llama)" transform="rotate(12 300 140)"/>
  <ellipse cx="300" cy="140" rx="10" ry="18" fill="#f8c0c0" transform="rotate(12 300 140)"/>

  <!-- Eyes -->
  <ellipse cx="236" cy="180" rx="9" ry="10" fill="#1e293b"/>
  <ellipse cx="276" cy="180" rx="9" ry="10" fill="#1e293b"/>
  <circle cx="239" cy="177" r="3" fill="white" opacity="0.8"/>
  <circle cx="279" cy="177" r="3" fill="white" opacity="0.8"/>

  <!-- Nostrils -->
  <ellipse cx="247" cy="205" rx="5" ry="4" fill="#94a3b8"/>
  <ellipse cx="265" cy="205" rx="5" ry="4" fill="#94a3b8"/>

  <!-- Beret (designer flair) -->
  <ellipse cx="266" cy="130" rx="72" ry="22" fill="url(#beret)" transform="rotate(-8 266 130)"/>
  <ellipse cx="272" cy="118" rx="24" ry="16" fill="#4f46e5"/>
  <circle  cx="272" cy="110" r="7" fill="#818cf8"/>

  <!-- Tiny pencil (designer detail) -->
  <g transform="translate(345 230) rotate(-35)">
    <rect x="-4" y="-32" width="8" height="50" rx="3" fill="#fbbf24"/>
    <polygon points="-4,18 4,18 0,28" fill="#f8c0c0"/>
    <rect x="-4" y="-38" width="8" height="10" rx="1" fill="#94a3b8"/>
  </g>

  <!-- Subtle indigo glow on beret -->
  <ellipse cx="266" cy="130" rx="72" ry="22" fill="none"
           stroke="#818cf8" stroke-width="2" opacity="0.4"
           transform="rotate(-8 266 130)"/>
</svg>